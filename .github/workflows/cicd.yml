name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # TODO 2: Ghi noi dung credentials ra file tam va set bien moi truong xac thuc.
        run: |
          python - <<'PYEOF'
          import json, os
          creds_raw = """${{ secrets.STORAGE_CREDENTIALS }}""".strip()
          if creds_raw:
              try:
                  creds = json.loads(creds_raw)
                  if "aws_access_key_id" in creds:
                      with open(os.environ["GITHUB_ENV"], "a") as f:
                          f.write(f"AWS_ACCESS_KEY_ID={creds['aws_access_key_id']}\n")
                          f.write(f"AWS_SECRET_ACCESS_KEY={creds['aws_secret_access_key']}\n")
                          if "aws_region" in creds:
                              f.write(f"AWS_DEFAULT_REGION={creds['aws_region']}\n")
                  elif "type" in creds and creds.get("type") == "service_account":
                      with open("/tmp/sa-key.json", "w") as f:
                          f.write(creds_raw)
                      with open(os.environ["GITHUB_ENV"], "a") as f:
                          f.write("GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json\n")
              except Exception as e:
                  print("Note parsing credentials:", e)
          PYEOF

      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # TODO 4: Doc gia tri "f1_score" tu outputs/report.json bang Python inline.
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        # TODO 5: Su dung cloud SDK de upload models/model.joblib len
        run: |
          python - <<'PYEOF'
          import os
          bucket = "${{ secrets.ARTIFACT_BUCKET }}".strip()
          model_path = "models/model.joblib"
          key = "artifacts/current/model.joblib"

          # Upload qua S3 (boto3)
          try:
              import boto3
              s3 = boto3.client("s3")
              s3.upload_file(model_path, bucket, key)
              print(f"Uploaded model to s3://{bucket}/{key}")
          except Exception as e_s3:
              # Hoac upload qua GCS
              try:
                  from google.cloud import storage
                  client = storage.Client()
                  b = client.bucket(bucket)
                  blob = b.blob(key)
                  blob.upload_from_filename(model_path)
                  print(f"Uploaded model to gs://{bucket}/{key}")
              except Exception as e_gcs:
                  raise RuntimeError(f"Upload failed. S3 error: {e_s3} | GCS error: {e_gcs}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        # TODO 6: Doc f1 tu output cua job train.
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          print(f"Evaluated F1 score: {f1:.4f}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print("PASSED: f1_score dat nguong chat luong. Tiep tuc trien khai.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # TODO 7 & 8: Restart service income-api tren VM va kiem tra healthz
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
